services:
  db:
    image: northstar-postgres:17-pgvector-0.8.7
    build:
      context: .
      dockerfile: services/api/postgres/Dockerfile
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
      POSTGRES_DB: support
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://support:${POSTGRES_PASSWORD:-support}@db:5432/support
    command: ["alembic", "-c", "services/api/alembic.ini", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  seed:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://support:${POSTGRES_PASSWORD:-support}@db:5432/support
    command: ["python", "-m", "support_api.seed"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://support:${POSTGRES_PASSWORD:-support}@db:5432/support
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
  agent:
    build: .
    env_file: .env
    environment:
      INTERNAL_API_URL: http://api:8000
    command: ["python", "-m", "support_agent.worker", "start"]
    depends_on:
      api: {condition: service_healthy}
  index-knowledge:
    build: .
    profiles: ["knowledge"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://support:${POSTGRES_PASSWORD:-support}@db:5432/support
    volumes: ["./knowledge_base:/app/knowledge_base:ro"]
    command: ["python", "-m", "support_api.knowledge", "index"]
    depends_on:
      seed: {condition: service_completed_successfully}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
